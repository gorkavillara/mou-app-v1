<!doctype html>
<meta charset="utf-8">
<title>Mou · extracción de landmarks desde foto (headless)</title>
<body>
<pre id="log">arrancando…</pre>
<script type="module">
/**
 * IMAGE-mode HandLandmarker driven from Node (see calibrate-from-photos.ts).
 *
 * Same CDN wasm + model as the app, so the landmarks here are the ones the
 * product would see. The only extra is a retry ladder (mirror / pad / upscale):
 * the goniometer photos are small WhatsApp crops of a hand in profile, which is
 * the hardest case for the detector. Every retry maps its landmarks back to the
 * ORIGINAL image frame, so downstream geometry is unaffected by the transform.
 */
import { FilesetResolver, HandLandmarker } from
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs';

const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const log = (m) => { document.getElementById('log').textContent = m; };
let landmarker = null;

async function boot() {
  const fileset = await FilesetResolver.forVisionTasks(WASM);
  const options = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL, delegate },
    runningMode: 'IMAGE',
    numHands: 1,
    minHandDetectionConfidence: 0.2,
    minHandPresenceConfidence: 0.2,
    minTrackingConfidence: 0.2,
  });
  try {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('GPU'));
  } catch {
    landmarker = await HandLandmarker.createFromOptions(fileset, options('CPU'));
  }
  log('listo');
  window.__mpReady = true;
}

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('no se pudo decodificar ' + src));
    img.src = src;
  });
}

window.__detect = async (url, scale = 3) => {
  const img = await loadImage(url);
  const W = Math.round(img.naturalWidth * scale);
  const H = Math.round(img.naturalHeight * scale);

  const paint = (w, h, fn) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    fn(ctx);
    return c;
  };

  const S = Math.round(Math.max(W, H) * 1.4);
  const ox = Math.round((S - W) / 2);
  const oy = Math.round((S - H) / 2);

  const attempts = [
    { name: 'upscaled', canvas: paint(W, H, (c) => c.drawImage(img, 0, 0, W, H)), flip: false },
    { name: 'mirror', flip: true,
      canvas: paint(W, H, (c) => { c.translate(W, 0); c.scale(-1, 1); c.drawImage(img, 0, 0, W, H); }) },
    { name: 'padded', flip: false, padX: ox, padY: oy, padded: true,
      canvas: paint(S, S, (c) => c.drawImage(img, ox, oy, W, H)) },
    { name: 'padded-mirror', flip: true, padX: ox, padY: oy, padded: true,
      canvas: paint(S, S, (c) => { c.translate(S, 0); c.scale(-1, 1); c.drawImage(img, ox, oy, W, H); }) },
  ];

  for (const a of attempts) {
    let r;
    try { r = landmarker.detect(a.canvas); } catch { continue; }
    if (!r?.landmarks?.length) continue;

    const cw = a.canvas.width, ch = a.canvas.height;
    // Undo mirroring + padding so coordinates come back normalised to the
    // ORIGINAL image, independent of which retry happened to succeed.
    const map = (p) => {
      let px = (a.flip ? 1 - p.x : p.x) * cw;
      let py = p.y * ch;
      if (a.padded) { px -= a.padX; py -= a.padY; }
      return { x: px / W, y: py / H, z: p.z, visibility: p.visibility };
    };

    return {
      attempt: a.name,
      landmarks: r.landmarks[0].map(map),
      handedness: (r.handedness ?? r.handednesses ?? [])[0]?.[0] ?? null,
      imageW: img.naturalWidth,
      imageH: img.naturalHeight,
    };
  }
  return { attempt: null, landmarks: null, imageW: img.naturalWidth, imageH: img.naturalHeight };
};

/**
 * Draws what was actually measured on top of the photo: the two bone segments
 * that form the joint, the vertex arc, and the numbers. This is the surgeon's
 * check that the tool measures where the goniometer was placed — the same
 * transparency goal as the on-video overlay in /dev/calibration.
 *
 * `chain` is [proximal, vertex, distal] landmark indices for the joint.
 */
window.__overlay = async (url, chain, labels) => {
  const img = await loadImage(url);
  const SCALE = 2;
  const W = img.naturalWidth * SCALE;
  const H = img.naturalHeight * SCALE;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);

  const det = await window.__detect(url);
  if (!det.landmarks) {
    ctx.fillStyle = 'rgba(220,38,38,0.9)';
    ctx.fillRect(0, 0, W, 34 * SCALE);
    ctx.fillStyle = '#fff';
    ctx.font = `${13 * SCALE}px system-ui, sans-serif`;
    ctx.fillText('MediaPipe no detectó mano', 8 * SCALE, 22 * SCALE);
    return c.toDataURL('image/png');
  }

  const pt = (i) => ({ x: det.landmarks[i].x * W, y: det.landmarks[i].y * H });
  const [a, v, b] = chain.map(pt);

  // Whole skeleton, faint, for context.
  const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],
                 [0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.5 * SCALE;
  for (const [i, j] of BONES) {
    const p = pt(i), q = pt(j);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }

  // The two measured segments.
  const seg = (p, q, color) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 4 * SCALE;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  };
  seg(a, v, '#007AFF');   // proximal bone
  seg(v, b, '#FB923C');   // distal bone

  // Vertex arc.
  const ang = (p, q) => Math.atan2(q.y - p.y, q.x - p.x);
  const r = Math.min(34 * SCALE, Math.hypot(v.x - a.x, v.y - a.y) * 0.6);
  ctx.strokeStyle = '#FACC15';
  ctx.lineWidth = 3 * SCALE;
  ctx.beginPath();
  ctx.arc(v.x, v.y, r, ang(v, a), ang(v, b));
  ctx.stroke();

  for (const p of [a, v, b]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 4 * SCALE, 0, Math.PI * 2); ctx.fill();
  }

  // Caption band.
  const lines = labels ?? [];
  const pad = 8 * SCALE;
  const lh = 17 * SCALE;
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, pad * 2 + lh * lines.length);
  ctx.fillStyle = '#fff';
  ctx.font = `${13 * SCALE}px system-ui, sans-serif`;
  lines.forEach((t, i) => ctx.fillText(t, pad, pad + lh * (i + 0.8)));

  return c.toDataURL('image/png');
};

boot().catch((e) => { log('ERROR ' + e.message); window.__mpError = String(e); });
</script>
